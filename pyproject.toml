[project]
name = "finagent"
version = "0.1.0"
description = "智能投研 Agent - 基于 LangGraph + RAG 的 A 股投研助手"
authors = [{name = "Xiong Xiong", email = "barryxiong820@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # 配置与工具
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    # LLM 生态（Day 2 会用）
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.50",
    # 数据源（Day 2 会用）
    "tushare>=1.4.0",
    "pandas>=2.2.0",
    # 存储
    "redis>=5.2.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "qdrant-client>=1.12.0",
    # HTTP
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "app>=0.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
